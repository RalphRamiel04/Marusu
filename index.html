
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Differences</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe082, #ffb74d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: white;
            padding: 50px 35px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #e69500;
            font-size: 38px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .bee {
            font-size: 75px;
            margin-bottom: 20px;
        }

        button {
            background: #ffb300;
            color: white;
            border: none;
            padding: 15px 55px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #f57c00;
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="bee">🐝</div>

        <h1>What's changed, Bee?</h1>

        <p>
            Find all 5 differences between the two pictures
            before the time runs out!
        </p>

        <button onclick="startGame()">START</button>

    </div>

    <script>
        function startGame() {
            window.location.href = "game.html";
        }
    </script>

</body>
</html>
