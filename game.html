
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Differences - Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff3cd;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #d88900;
            margin-bottom: 15px;
        }

        .game-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 20px 0;
            font-size: 22px;
            font-weight: bold;
        }

        .timer {
            color: #e53935;
        }

        .score {
            color: #388e3c;
        }

        .instruction {
            margin-bottom: 20px;
            color: #555;
            font-size: 17px;
        }

        .image-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        .game-image {
            display: block;
            width: 100%;
            height: auto;
            border: 5px solid #d89b24;
            border-radius: 12px;
        }

        .hotspot {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 7%;
            aspect-ratio: 1;
            border: 3px solid transparent;
            border-radius: 50%;
            background: transparent;
            cursor: crosshair;
            z-index: 2;
        }

        .hotspot:hover {
            border-color: rgba(255, 0, 0, 0.7);
            background: rgba(255, 255, 0, 0.15);
        }

        .hotspot.found {
            border: 4px solid #00c853;
            background: rgba(0, 200, 83, 0.25);
            cursor: default;
            pointer-events: none;
        }

        .hotspot.found::after {
            content: "✓";
            color: #00c853;
            font-size: 35px;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        button {
            background: #ffb300;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #f57c00;
        }

        .message {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        .message-box {
            background: white;
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
        }

        .message-box h2 {
            color: #e69500;
            margin-bottom: 15px;
            font-size: 30px;
        }

        .message-box p {
            font-size: 18px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .game-info {
                font-size: 18px;
                gap: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .instruction {
                font-size: 14px;
            }

            .hotspot.found::after {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>🐝 Find the Differences! 🐝</h1>

    <div class="game-info">
        <div class="timer">
            ⏰ Time: <span id="time">60</span>s
        </div>

        <div class="score">
            ⭐ Found: <span id="score">0</span>/5
        </div>
    </div>

    <p class="instruction">
        Look carefully at Picture 1 and Picture 2.
        Click the areas where you see differences!
    </p>

    <div class="image-container">

        <img src="bee.jpg" class="game-image" alt="Find the differences bee classroom">

<!-- Difference 1: Bee Kind changed to Bee Mean -->
<button class="hotspot" style="left:8%; top:15%;"
    data-id="1"></button>
<button class="hotspot" style="left:58%; top:15%;"
    data-id="1"></button>


<!-- Difference 2: Bee is no longer raising its hand -->
<button class="hotspot" style="left:24%; top:48%;"
    data-id="2"></button>
<button class="hotspot" style="left:74%; top:48%;"
    data-id="2"></button>


<!-- Difference 3: One bee is sleeping on the desk -->
<button class="hotspot" style="left:39%; top:47%;"
    data-id="3"></button>
<button class="hotspot" style="left:89%; top:47%;"
    data-id="3"></button>


<!-- Difference 4: Blue backpack moved to the right side -->
<button class="hotspot" style="left:5%; top:85%; width:5%;"
    data-id="4"></button>
<button class="hotspot" style="left:96%; top:53%; width:5%;"
    data-id="4"></button>


<!-- Difference 5: Pink book disappeared -->
<button class="hotspot" style="left:39%; top:75%;"
    data-id="5"></button>
<button class="hotspot" style="left:89%; top:75%;"
    data-id="5"></button>

    </div>

    <div class="message" id="message">
        <div class="message-box">
            <h2 id="resultTitle">Congratulations!</h2>

            <p id="resultText">
                You found all the differences!
            </p>

            <button onclick="restartGame()">
                Play Again
            </button>

            <button onclick="goHome()">
                Home
            </button>
        </div>
    </div>

    <script>

        let timeLeft = 60;
        let score = 0;
        let timer;
        let gameEnded = false;

        const timeDisplay = document.getElementById("time");
        const scoreDisplay = document.getElementById("score");
        const hotspots = document.querySelectorAll(".hotspot");

        // Start countdown
        function startTimer() {

            timer = setInterval(function() {

                if (gameEnded) {
                    clearInterval(timer);
                    return;
                }

                timeLeft--;

                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 10) {
                    timeDisplay.style.color = "red";
                }

                if (timeLeft <= 0) {
                    endGame(false);
                }

            }, 1000);
        }

        // Check clicked differences
hotspots.forEach(function(hotspot) {

    hotspot.addEventListener("click", function() {

        if (gameEnded) return;

        let differenceID = hotspot.dataset.id;

        // Check if this difference was already found
        let alreadyFound = document.querySelector(
            '.hotspot[data-id="' + differenceID + '"].found'
        );

        if (!alreadyFound) {

            // Mark BOTH matching circles
            document.querySelectorAll(
                '.hotspot[data-id="' + differenceID + '"]'
            ).forEach(function(circle) {

                circle.classList.add("found");

            });

            // Add only one point
            score++;

            scoreDisplay.textContent = score;

            // Check if all 5 differences are found
            if (score === 5) {
                endGame(true);
            }

        }

    });

});

        // End game
        function endGame(won) {

            gameEnded = true;

            clearInterval(timer);

            const message = document.getElementById("message");
            const title = document.getElementById("resultTitle");
            const text = document.getElementById("resultText");

            message.style.display = "flex";

            if (won) {

                title.textContent = "🎉 Congratulations!";

                text.textContent =
                    "Amazing! You found all 5 differences!";

            } else {

                title.textContent = "⏰ Time's Up!";

                text.textContent =
                    "You found " + score +
                    " out of 5 differences. Try again!";

            }
        }

        // Restart game
        function restartGame() {
            window.location.reload();
        }

        // Return to home page
        function goHome() {
            window.location.href = "index.html";
        }

        // Begin timer when page loads
        startTimer();

    </script>

</body>
</html>
